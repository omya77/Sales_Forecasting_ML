<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="sfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4338ca" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sfBg)" filter="url(#sfShadow)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Outer CPU Pins -->
  <g stroke="#a5b4fc" stroke-width="2" stroke-linecap="round">
    <line x1="24" y1="12" x2="24" y2="17" />
    <line x1="32" y1="12" x2="32" y2="17" />
    <line x1="40" y1="12" x2="40" y2="17" />

    <line x1="24" y1="47" x2="24" y2="52" />
    <line x1="32" y1="47" x2="32" y2="52" />
    <line x1="40" y1="47" x2="40" y2="52" />

    <line x1="12" y1="24" x2="17" y2="24" />
    <line x1="12" y1="32" x2="17" y2="32" />
    <line x1="12" y1="40" x2="17" y2="40" />

    <line x1="47" y1="24" x2="52" y2="24" />
    <line x1="47" y1="32" x2="52" y2="32" />
    <line x1="47" y1="40" x2="52" y2="40" />
  </g>

  <!-- Central Microchip Core -->
  <rect x="17" y="17" width="30" height="30" rx="7" fill="url(#chipGrad)" stroke="url(#neonGlow)" stroke-width="1.8"/>

  <!-- Upward Forecast Trendline with Spark Nodes -->
  <path d="M22 37 L28 32 L34 35 L41 24" fill="none" stroke="url(#neonGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polygon points="42,23 37,25 40,29" fill="#00f2fe"/>
  <!-- Data Points -->
  <circle cx="22" cy="37" r="1.5" fill="#ffffff"/>
  <circle cx="28" cy="32" r="1.5" fill="#ffffff"/>
  <circle cx="34" cy="35" r="1.5" fill="#ffffff"/>
  <circle cx="41" cy="24" r="1.8" fill="#00f2fe"/>
</svg>