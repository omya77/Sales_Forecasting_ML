services:
  - type: web
    name: sales-forecast-ai
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir sales_web sales_web.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@salesforecast.ai
